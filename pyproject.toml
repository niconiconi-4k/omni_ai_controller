[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-ai-controller"
version = "0.1.0"
description = "Interactive console for controlling an Omni AI model server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omni-ai-controller = "omni_ai_controller.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
